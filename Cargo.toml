[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
bpe-core = { path = "crates/bpe-core" }
bpe-settings-derive = { path = "crates/bpe-settings-derive" }
bpe-runtime = { path = "crates/bpe-runtime" }
bpe-gfx = { path = "crates/bpe-gfx" }
bpe-kit = { path = "crates/bpe-kit" }
bpe-cli = { path = "crates/bpe-cli" }
bpe-dsp = { path = "crates/bpe-dsp" }
bpe-sound = { path = "crates/bpe-sound" }
serde = { version = "1", features = ["derive"] }
ron = "0.12"
glam = { version = "0.34", features = ["serde", "bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
anyhow = "1"
pollster = "1"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
egui-wgpu = "0.37"
wgpu = "30"
rfd = "0.17"
cpal = "0.18"
rubato = "0.16"
rtrb = "0.3"
hound = "3.5"
wide = "0.7"
tempfile = "3"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
lto = "fat"
codegen-units = 1
