[package]
name = "bpe-water"
description = "Water mode's own engine: the liquid's physics on the graphics card (every drop feeling its neighbours, in frames of steps it picks itself, deep water held up by a pressure solved on a grid) and its plain drawing there"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bpe-core.workspace = true
bpe-gfx.workspace = true
wgpu.workspace = true
bytemuck.workspace = true
glam.workspace = true
anyhow.workspace = true
serde.workspace = true
pollster.workspace = true
# The final's take: its frames and restart points compressed (pure Rust).
lz4_flex = "0.11"
# Debug pictures of the drops (`probe::save_png`), for the measuring tests.
png = "0.18"

[features]
# The physics test scenes (`scenes`): only tests and the side-by-side with today's core turn this on.
test-scenes = []

[dev-dependencies]
bpe-water = { path = ".", features = ["test-scenes"] }
