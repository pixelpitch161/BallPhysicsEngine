[package]
name = "bpe-cli"
description = "Exports the modular Ball Studio's scenes to mp4, from the command line or the editor"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "bpe-render-next"
path = "src/main.rs"

[dependencies]
bpe-core.workspace = true
bpe-runtime.workspace = true
bpe-gfx.workspace = true
bpe-kit.workspace = true
bpe-sound.workspace = true
anyhow.workspace = true
tempfile.workspace = true

[dev-dependencies]
bpe-kit = { workspace = true, features = ["test-scenes"] }
bpe-sound = { workspace = true, features = ["test-tone"] }
glam.workspace = true
png = "0.18"
