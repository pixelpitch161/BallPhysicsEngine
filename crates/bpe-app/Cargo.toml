[package]
name = "bpe-app"
description = "Editor for designing, previewing and exporting ball physics videos"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ball-studio"
path = "src/main.rs"

[dependencies]
bpe-scene = { workspace = true, features = ["import"] }
bpe-sim.workspace = true
bpe-audio.workspace = true
bpe-render.workspace = true
bpe-export.workspace = true
bpe-graph.workspace = true
bpe-music.workspace = true
eframe.workspace = true
egui-wgpu.workspace = true
cpal.workspace = true
rfd.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json = "1"

[dev-dependencies]
egui_kittest = "0.37"
