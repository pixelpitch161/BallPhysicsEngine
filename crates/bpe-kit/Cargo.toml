[package]
name = "bpe-kit"
description = "The modular Ball Studio's plugins: every thing and module kind, one folder each"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bpe-core.workspace = true
bpe-dsp.workspace = true
bpe-runtime.workspace = true
bpe-gfx.workspace = true
glam.workspace = true
serde.workspace = true
anyhow.workspace = true
# Glyph outlines for the Word group shape (the same version egui already uses).
skrifa = "0.44"
# Pictures for the Particles thing's picture source.
png = "0.18"

[features]
# The test scenes (and the shape-plus-ball `new_scene`): only tests turn this on, so the program ships
# with no built-in scenes.
test-scenes = []

[dev-dependencies]
bpe-kit = { path = ".", features = ["test-scenes"] }
ron.workspace = true
