[package]
name = "bpe-kit"
description = "The modular Ball Studio's plugins: every thing and module kind, one folder each"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bpe-core.workspace = true
bpe-dsp.workspace = true
bpe-runtime.workspace = true
bpe-gfx.workspace = true
glam.workspace = true
serde.workspace = true
anyhow.workspace = true
# Glyph outlines for the Word group shape (the same version egui already uses).
skrifa = "0.44"
# Pictures for the Particles thing's picture source.
png = "0.18"
# The Text thing: shaping (kerning, ligatures, weight axes) and merging a glyph's overlapping
# contours into one clean outline.
rustybuzz.workspace = true
i_overlay.workspace = true
# One lasting pool of worker threads for the air and particle steps (already in the build through other crates).
rayon = "1"
# Water mode: the carved course's solid field and a Water scene as the water engine's inputs (part 2b).
bpe-water.workspace = true
wgpu.workspace = true
# Water mode part 8: a final's take's head.
ron.workspace = true

# The free room on the disk a final is made on.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[features]
# The test scenes (and the shape-plus-ball `new_scene`): only tests turn this on. They are not the
# built-in scenes people open from the Scenes window (`library/`), which always ship.
test-scenes = []

[dev-dependencies]
bpe-kit = { path = ".", features = ["test-scenes"] }
# Water mode part 2a: the water core's test scenes (tests/water_core.rs).
bpe-water = { workspace = true, features = ["test-scenes"] }
