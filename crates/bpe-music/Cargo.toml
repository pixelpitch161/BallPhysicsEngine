[package]
name = "bpe-music"
description = "Song analysis for the ball physics engine: decoding, beats, tempo, bass/mid/treble levels and MIDI melodies"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["decode"]
# Reading mp3, wav, ogg and flac files. Without it the crate only analyses samples it is given.
decode = ["dep:symphonia"]

[dependencies]
anyhow.workspace = true
realfft = "3.4"
midly = { version = "0.5.3", default-features = false, features = ["std", "alloc"] }
symphonia = { version = "0.5", optional = true, default-features = false, features = ["mp3", "wav", "pcm", "ogg", "vorbis", "flac"] }

[dev-dependencies]
hound.workspace = true
