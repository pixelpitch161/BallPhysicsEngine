# cargo-nextest settings (CI runs the tests with it; see docs/notes/checks.md).

[profile.default]
# Two at a time: the picture tests on the software graphics driver run out of memory with more.
test-threads = 2
# Print a SLOW line for any test still running after two minutes (it keeps running).
slow-timeout = { period = "120s" }

[profile.ci]
test-threads = 2
# Run every test even after a failure, like `cargo test --no-fail-fast`, so one failure doesn't hide another.
fail-fast = false
slow-timeout = { period = "120s" }
# Show each failure's output as it happens and again at the end, and list the slow tests at the end.
failure-output = "immediate-final"
final-status-level = "slow"

[profile.pc]
# The owner's PC (16 threads, 44 GB for the checks; docs/notes/checks.md, "On the owner's PC"): one machine runs every
# test, so more at a time. Otherwise the same as ci. Measured on bpe-gfx's 361 unit tests: 8 at a time with lavapipe
# using every thread took 160 s, 12 at a time with LP_NUM_THREADS=2 (in the runners' .env) 127 s, 16 with 1 thread
# 123 s; 12 keeps the long single picture tests from crawling.
test-threads = 12
fail-fast = false
slow-timeout = { period = "120s" }
failure-output = "immediate-final"
final-status-level = "slow"

# On the PC the run ends when its slowest test does, so the known long ones (several minutes each on the software
# driver) start first instead of trailing at the end.
[[profile.pc.overrides]]
filter = """
binary(golden_liquid) | binary(liquid_sound) | binary(ready_look_pictures) | binary(liquid_look_pictures)
| test(/^things::liquid::tests_sound::/) | (package(bpe-sound) & binary(alloc))
"""
priority = 100

# A test that compares two timings of its own, or times itself against real time, needs the machine to itself: at 12
# at a time "Osc B off" once measured slower than on, and with the card's checks running beside them on the same
# processor the sound job's tests and the bake check ran slow.
[[profile.pc.overrides]]
filter = """
(package(bpe-sound) & binary(shape_voice) & test(=osc_b_off_costs_nothing | =building_for_the_editor_never_bakes))
| (package(bpe-studio) & test(/^sound_job::tests::/))
"""
threads-required = "num-test-threads"

[profile.gpu]
# The owner's graphics card (an AMD RX 9070 XT on Windows; job "Pictures (owner's graphics card)",
# docs/notes/checks.md). Every test runs here natively except the sound goldens, pinned to Ubuntu's maths library,
# which Windows' rounds a hair differently (the sound's own oscillators still use it). The physics uses
# `bpe_core::maths`, which rounds the same everywhere, so the CPU physics goldens run here too.
# KNOWN ON THE CARD (owner's choice 2026-11-22, "switch now, fix after"): the four tests that failed only on the
# owner's card or Windows are all fixed and run here (docs/notes/checks.md). A new one goes back in this filter
# only by the owner's choice, and leaves it in the change that fixes it.
# (golden_liquid draws, so it runs here, with its golden made on the card.) Also left out: osc_b_off_costs_nothing,
# which times the machine against itself and runs on the Linux machines, while the Linux checks share this PC's
# processor with this job.
default-filter = """
not (
  (package(bpe-sound) & test(/golden/))
  | (package(bpe-sound) & binary(shape_voice) & test(=osc_b_off_costs_nothing))
)
"""
test-threads = 8
fail-fast = false
slow-timeout = { period = "120s" }
failure-output = "immediate-final"
final-status-level = "slow"

# As on the pc profile: the sound job's tests time themselves against real time, so each runs alone.
[[profile.gpu.overrides]]
filter = "package(bpe-studio) & test(/^sound_job::tests::/)"
threads-required = "num-test-threads"

[[profile.gpu.overrides]]
filter = """
binary(golden_liquid) | binary(liquid_sound) | binary(ready_look_pictures) | binary(liquid_look_pictures)
| test(/^things::liquid::tests_sound::/) | (package(bpe-sound) & binary(alloc))
"""
priority = 100
