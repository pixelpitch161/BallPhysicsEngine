# Checks every pull request and every push to main: formatting, lint, all tests on a software graphics driver,
# the release goldens and the Windows cross-build. See CLAUDE.md, "Working rules".
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config libudev-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Tests (debug, software GPU)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: System packages (Mesa's software Vulkan driver, ffmpeg for the export tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libudev-dev mesa-vulkan-drivers ffmpeg \
            libxkbcommon-x11-0 libxkbcommon0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the tests
        run: cargo test --workspace --no-run
      - name: bpe-gfx tests (two at a time, they need the memory)
        run: cargo test -p bpe-gfx -- --test-threads=2
      - name: Every other crate's tests
        run: cargo test --workspace --exclude bpe-gfx

  release-goldens:
    name: Goldens (release)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # LTO and a single codegen unit only make the shipped exe smaller and faster; they can't change a float result
      # (Rust does no fast-math or float contraction), so the release goldens are checked without them.
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v4
      - name: System packages (Mesa's software Vulkan driver for the pinned pictures)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libudev-dev mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Physics goldens and pinned pictures
        run: cargo test --release -p bpe-kit --test 'golden*' --test unlit_pictures --test lit_flat_pinned
      - name: Sound goldens
        run: cargo test --release -p bpe-sound --test chain --test shape_voice --test mod_matrix

  windows:
    name: Windows cross-build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v4
      - name: MinGW
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Build the editor and the renderer for Windows
        run: cargo build --release --target x86_64-pc-windows-gnu -p bpe-studio -p bpe-cli
