# Checks every pull request and every push to main: formatting, lint, the tests on a software graphics driver, the
# release goldens and the Windows cross-build. A pull request runs only what its changes can affect (the "What
# changed" job); a push to main and a manual run check everything. See docs/notes/checks.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job runs on Ubuntu 24.04, the cloud containers' system: the goldens hash float results, and the C maths
# library's sin/cos/exp differ in the last bit between glibc versions (on ubuntu-26.04 one particle golden moves), the
# same known gap as native Windows. Move the image forward together with a re-bless of the goldens.
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  # Which crates a pull request touches, plus every crate that depends on them; notes and docs alone need no build.
  # A shared file (Cargo.lock, the workspace Cargo.toml, rust-toolchain.toml, CI, assets) runs everything.
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.pick.outputs.code }}
      filter: ${{ steps.pick.outputs.filter }}
      goldens_kit: ${{ steps.pick.outputs.goldens_kit }}
      goldens_sound: ${{ steps.pick.outputs.goldens_sound }}
      windows: ${{ steps.pick.outputs.windows }}
    steps:
      - uses: actions/checkout@v5
        with:
          # A pull request checks out its merge commit; its first parent is the branch it merges into.
          fetch-depth: 2
      - name: Pick the checks
        id: pick
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            python3 .github/scripts/affected.py HEAD^1 > picked.txt
          else
            python3 .github/scripts/affected.py --all > picked.txt
          fi
          cat picked.txt
          cat picked.txt >> "$GITHUB_OUTPUT"
          { echo '```'; cat picked.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  fmt:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Rust (the version in rust-toolchain.toml)
        run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/apt
        with:
          cache-name: clippy
          packages: libasound2-dev pkg-config libudev-dev
      - name: Rust (the version in rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-ubuntu-24.04
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # The tests are split across four machines that run at the same time. cargo-nextest's slice partition lines up the
  # tests of every test binary together and deals them out to the four machines, so the long binaries (bpe-kit's
  # 1,091 unit tests took 36 minutes on one machine) are shared out too. Each machine still runs only two at a time:
  # the picture tests on the software driver need the memory. See docs/superpowers/plans/2026-11-21-faster-checks.md.
  test-shard:
    name: Tests ${{ matrix.shard }}/4 (debug, software GPU)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: System packages (Mesa's software Vulkan driver, ffmpeg for the export tests)
        uses: ./.github/actions/apt
        with:
          cache-name: tests
          packages: >-
            libasound2-dev pkg-config libudev-dev mesa-vulkan-drivers ffmpeg libxkbcommon-x11-0 libxkbcommon0
      - name: Rust (the version in rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-ubuntu-24.04
          # The four machines build the same thing, so one saving the cache is enough.
          save-if: ${{ matrix.shard == 1 }}
      # After the cache, so a cached ~/.cargo/bin can't swap in another version. Pinned: move it on purpose.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.152
      - name: Tests
        # One package selection, so every crate builds once with one set of features (and the cache always fits);
        # the filter then keeps only the affected crates' tests, before they are dealt out to the four machines.
        # Two at a time and no stopping at the first failure come from the ci profile in .config/nextest.toml.
        run: >-
          cargo nextest run --workspace --profile ci --partition slice:${{ matrix.shard }}/4 --no-tests=pass
          -E '${{ needs.changes.outputs.filter }}'
      - name: Doc-tests
        # nextest doesn't run doc-tests, so one machine runs them with cargo test (there are none yet).
        if: matrix.shard == 1 && !cancelled()
        run: cargo test --workspace --doc --no-fail-fast

  # The one name to look for: green only when every test machine passed.
  test:
    name: Tests (debug, software GPU)
    if: always()
    needs: [changes, test-shard]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Skipped is fine only when "What changed" worked and found no code to test.
      - name: Every test machine passed
        run: |
          test "${{ needs.changes.result }}" = success
          test "${{ needs.test-shard.result }}" = success ||
            { test "${{ needs.test-shard.result }}" = skipped && test "${{ needs.changes.outputs.code }}" = false; }

  release-goldens:
    name: Goldens (release)
    needs: changes
    if: needs.changes.outputs.goldens_kit == 'true' || needs.changes.outputs.goldens_sound == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # LTO and a single codegen unit only make the shipped exe smaller and faster; they can't change a float result
      # (Rust does no fast-math or float contraction), so the release goldens are checked without them.
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v5
      - name: System packages (Mesa's software Vulkan driver for the pinned pictures)
        uses: ./.github/actions/apt
        with:
          cache-name: goldens
          packages: libasound2-dev pkg-config libudev-dev mesa-vulkan-drivers
      - name: Rust (the version in rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-ubuntu-24.04
      - name: Physics goldens and pinned pictures
        if: needs.changes.outputs.goldens_kit == 'true'
        run: cargo test --release -p bpe-kit --test 'golden*' --test unlit_pictures --test lit_flat_pinned
      - name: Sound goldens
        if: needs.changes.outputs.goldens_sound == 'true' && !cancelled()
        # Only the goldens: the release-only speed checks in these files measure the machine, not the code.
        run: cargo test --release -p bpe-sound --test chain --test shape_voice --test mod_matrix golden

  windows:
    name: Windows cross-build
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v5
      - name: MinGW
        uses: ./.github/actions/apt
        with:
          cache-name: mingw
          packages: gcc-mingw-w64-x86-64
      - name: Rust (the version in rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-ubuntu-24.04
      - name: Build the editor and the renderer for Windows
        run: cargo build --release --target x86_64-pc-windows-gnu -p bpe-studio -p bpe-cli
