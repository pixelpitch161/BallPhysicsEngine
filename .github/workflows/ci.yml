# Checks every pull request and every push to main: formatting, lint, the tests (the ones that draw on the owner's
# graphics card, the rest on Linux), the release goldens and the Windows cross-build. A pull request runs only what its changes can affect (the "What
# changed" job); a push to main and a manual run check everything. See docs/notes/checks.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      github_machines:
        description: Run on GitHub's machines even when the owner's PC is on
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job runs on Ubuntu 24.04 (GitHub's machines, or WSL Ubuntu 24.04 on the owner's PC), the cloud containers'
# system: the goldens hash float results, and the C maths library's sin/cos/exp differ in the last bit between glibc
# versions (on ubuntu-26.04 one particle golden moves), the same known gap as native Windows. Move the image forward
# together with a re-bless of the goldens.
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  # Which crates a pull request touches, plus every crate that depends on them; notes and docs alone need no build.
  # A shared file (Cargo.lock, the workspace Cargo.toml, rust-toolchain.toml, CI, assets) runs everything.
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.pick.outputs.code }}
      filter: ${{ steps.pick.outputs.filter }}
      goldens_kit: ${{ steps.pick.outputs.goldens_kit }}
      fork: ${{ steps.where.outputs.fork }}
      goldens_sound: ${{ steps.pick.outputs.goldens_sound }}
      windows: ${{ steps.pick.outputs.windows }}
      runner: ${{ steps.where.outputs.runner }}
      shards: ${{ steps.where.outputs.shards }}
      profile: ${{ steps.where.outputs.profile }}
    steps:
      - uses: actions/checkout@v5
        with:
          # A pull request checks out its merge commit; its first parent is the branch it merges into.
          fetch-depth: 2
      - name: Pick the checks
        id: pick
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            python3 .github/scripts/affected.py HEAD^1 > picked.txt
          else
            python3 .github/scripts/affected.py --all > picked.txt
          fi
          cat picked.txt
          cat picked.txt >> "$GITHUB_OUTPUT"
          { echo '```'; cat picked.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # The owner's PC takes the heavy jobs when it is on: its runners (label bpe-pc, in WSL Ubuntu 24.04 with the same
      # software graphics driver, so every golden matches) set BPE_PC_HEARTBEAT every minute. A pull request from a
      # fork never runs there. Otherwise GitHub's machines run them, four test machines as before.
      # See docs/notes/checks.md, "On the owner's PC".
      - name: Pick the machines
        id: where
        env:
          BEAT: ${{ vars.BPE_PC_HEARTBEAT }}
          FORCE_GITHUB: ${{ inputs.github_machines || false }}
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          now=$(date +%s)
          case "$BEAT" in ''|*[!0-9]*) beat=0 ;; *) beat=$BEAT ;; esac
          age=$((now - beat))
          if [ "$FORCE_GITHUB" = true ]; then
            why="asked for when the run was started"; pc=false
          elif [ "$EVENT" = pull_request ] && [ "$HEAD_REPO" != "$REPO" ]; then
            why="a pull request from a fork"; pc=false
          elif [ "$age" -lt 180 ]; then
            why="the PC was last seen ${age}s ago"; pc=true
          else
            why="the PC was last seen ${age}s ago (off)"; pc=false
          fi
          fork=false
          if [ "$EVENT" = pull_request ] && [ "$HEAD_REPO" != "$REPO" ]; then fork=true; fi
          echo "fork=$fork" >> "$GITHUB_OUTPUT"
          if $pc; then
            echo 'runner=["self-hosted","bpe-pc"]' >> "$GITHUB_OUTPUT"
            echo 'shards=[1]' >> "$GITHUB_OUTPUT"
            echo 'profile=pc' >> "$GITHUB_OUTPUT"
            where="the owner's PC"
          else
            echo 'runner="ubuntu-24.04"' >> "$GITHUB_OUTPUT"
            echo 'shards=[1,2,3,4]' >> "$GITHUB_OUTPUT"
            echo 'profile=ci' >> "$GITHUB_OUTPUT"
            where="GitHub's machines"
          fi
          echo "Heavy jobs run on $where: $why." | tee -a "$GITHUB_STEP_SUMMARY"
          echo "The tests that draw always run on the owner's graphics card (they wait while the PC is off)." \
            | tee -a "$GITHUB_STEP_SUMMARY"

  fmt:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Rust (the version in rust-toolchain.toml)
        # One at a time: the owner's PC runs four jobs side by side sharing one ~/.rustup.
        run: flock "$HOME/.rustup-install.lock" rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.runner) }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/apt
        if: runner.environment == 'github-hosted'
        with:
          cache-name: clippy
          packages: libasound2-dev pkg-config libudev-dev
      - name: Rust (the version in rust-toolchain.toml)
        # One at a time: the owner's PC runs four jobs side by side sharing one ~/.rustup.
        run: flock "$HOME/.rustup-install.lock" rustup toolchain install
      # The PC keeps build files between runs, one folder per job (a job can land on any of the four runners, and
      # cargo locks a folder while it builds). Outside the checkout, which actions/checkout cleans.
      - name: Build files folder (owner's PC)
        if: runner.environment == 'self-hosted'
        run: echo "CARGO_TARGET_DIR=$HOME/target/${{ github.job }}" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          prefix-key: v1-ubuntu-24.04
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # On GitHub's machines the tests are split across four machines that run at the same time. cargo-nextest's slice
  # partition lines up the tests of every test binary together and deals them out, so the long binaries (bpe-kit's
  # 1,091 unit tests took 36 minutes on one machine) are shared out too. Each machine still runs only two at a time:
  # the picture tests on the software driver need the memory. See docs/superpowers/plans/2026-11-21-faster-checks.md.
  # On the owner's PC one job runs every test, more at a time (the pc profile).
  # The tests that draw don't run here: BPE_SKIP_GPU_TESTS=1 ends each one as passed at bpe_gfx::test_device(), and
  # the gpu-pictures job runs them on the owner's graphics card instead.
  test-shard:
    name: Tests ${{ matrix.shard }}/${{ strategy.job-total }} (debug, no drawing)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.runner) }}
    timeout-minutes: 90
    env:
      BPE_SKIP_GPU_TESTS: "1"
    strategy:
      fail-fast: false
      matrix:
        # [1] on the owner's PC (one machine runs every test), [1, 2, 3, 4] on GitHub's machines.
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
    steps:
      - uses: actions/checkout@v5
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: System packages (Mesa's software Vulkan driver, ffmpeg for the export tests)
        if: runner.environment == 'github-hosted'
        uses: ./.github/actions/apt
        with:
          cache-name: tests
          packages: >-
            libasound2-dev pkg-config libudev-dev mesa-vulkan-drivers ffmpeg libxkbcommon-x11-0 libxkbcommon0
      - name: Rust (the version in rust-toolchain.toml)
        # One at a time: the owner's PC runs four jobs side by side sharing one ~/.rustup.
        run: flock "$HOME/.rustup-install.lock" rustup toolchain install
      # The PC keeps build files between runs, one folder per job (a job can land on any of the four runners, and
      # cargo locks a folder while it builds). Outside the checkout, which actions/checkout cleans.
      - name: Build files folder (owner's PC)
        if: runner.environment == 'self-hosted'
        run: echo "CARGO_TARGET_DIR=$HOME/target/${{ github.job }}" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          prefix-key: v2-ubuntu-24.04
          # The four machines build the same thing, so one saving the cache is enough.
          save-if: ${{ matrix.shard == 1 }}
      # After the cache, so a cached ~/.cargo/bin can't swap in another version. Pinned: move it on purpose, together
      # with tools/pc-runner/setup-wsl.sh, which installs it once on the PC (four jobs writing one ~/.cargo/bin at
      # the same time collide).
      - uses: taiki-e/install-action@v2
        if: runner.environment == 'github-hosted'
        with:
          tool: cargo-nextest@0.9.152
      - name: Tests
        # One package selection, so every crate builds once with one set of features (and the cache always fits);
        # the filter then keeps only the affected crates' tests, before they are dealt out to the four machines.
        # How many at a time and no stopping at the first failure come from the ci or pc profile in
        # .config/nextest.toml.
        run: >-
          cargo nextest run --workspace --profile ${{ needs.changes.outputs.profile }}
          --partition slice:${{ matrix.shard }}/${{ strategy.job-total }} --no-tests=pass
          -E '${{ needs.changes.outputs.filter }}'
      - name: Doc-tests
        # nextest doesn't run doc-tests, so one machine runs them with cargo test (there are none yet).
        if: matrix.shard == 1 && !cancelled()
        run: cargo test --workspace --doc --no-fail-fast

  # The tests that draw, on the owner's graphics card (an AMD RX 9070 XT, native Windows): every test except the
  # goldens pinned to Ubuntu's maths library (the gpu profile in .config/nextest.toml), then the pictures pinned to
  # the card in release, then timings. There is no fallback: while the PC is off this job waits in the queue.
  # The pinned pictures are refreshed with the "Refresh GPU pictures" workflow (gpu-pictures.yml).
  # See docs/notes/checks.md, "The owner's graphics card".
  gpu-pictures:
    name: Pictures (owner's graphics card)
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.fork == 'false'
    runs-on: [self-hosted, Windows, bpe-gpu]
    timeout-minutes: 90
    defaults:
      run:
        shell: powershell
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v5
      - name: Rust (the version in rust-toolchain.toml)
        run: rustup toolchain install
      # Build files stay between runs, outside the checkout (BPE_GPU_TARGET comes from the runner's .env).
      - name: Build files folder
        run: Add-Content -Path $env:GITHUB_ENV -Value "CARGO_TARGET_DIR=$env:BPE_GPU_TARGET\${{ github.job }}"
      - name: Which card
        run: vulkaninfo --summary | Select-String -Pattern 'deviceName|driverName|driverInfo'
      - name: Tests on the card
        run: >-
          cargo nextest run --workspace --profile gpu --no-tests=pass
          -E '${{ needs.changes.outputs.filter }}'
      - name: Pictures pinned to the card (release)
        if: needs.changes.outputs.goldens_kit == 'true' && !cancelled()
        run: cargo test --release -p bpe-kit --test unlit_pictures --test lit_flat_pinned --test golden_liquid
      - name: Timings on the card
        if: needs.changes.outputs.goldens_kit == 'true' && !cancelled()
        continue-on-error: true
        run: |
          # Through cmd, so the timings printed to stderr join the output without PowerShell treating them as errors.
          $out = cmd /c "cargo test --release -p bpe-kit --test liquid_speed --test light_speed -- --ignored --nocapture --test-threads=1 2>&1"
          $out
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Timings on the owner's graphics card"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
          $out | Where-Object { "$_" -match 'card:|ms per second|ms a frame' } | ForEach-Object { "$_" } |
            Add-Content -Path $env:GITHUB_STEP_SUMMARY
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'

  # The one name to look for: green only when every test machine and the card passed.
  test:
    name: Tests
    if: always()
    needs: [changes, test-shard, gpu-pictures]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Skipped is fine only when "What changed" worked and found no code to test.
      - name: Every test machine passed
        run: |
          test "${{ needs.changes.result }}" = success
          test "${{ needs.test-shard.result }}" = success ||
            { test "${{ needs.test-shard.result }}" = skipped && test "${{ needs.changes.outputs.code }}" = false; }
      - name: The tests that draw passed on the owner's graphics card
        run: |
          if [ "${{ needs.changes.outputs.fork }}" = true ] && [ "${{ needs.changes.outputs.code }}" = true ]; then
            echo "A pull request from a fork: the tests that draw run only on the owner's PC, never for a fork."
            exit 1
          fi
          test "${{ needs.gpu-pictures.result }}" = success ||
            { test "${{ needs.gpu-pictures.result }}" = skipped && test "${{ needs.changes.outputs.code }}" = false; }

  release-goldens:
    name: Goldens (release)
    needs: changes
    if: needs.changes.outputs.goldens_kit == 'true' || needs.changes.outputs.goldens_sound == 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.runner) }}
    timeout-minutes: 90
    env:
      # LTO and a single codegen unit only make the shipped exe smaller and faster; they can't change a float result
      # (Rust does no fast-math or float contraction), so the release goldens are checked without them.
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v5
      - name: System packages
        if: runner.environment == 'github-hosted'
        uses: ./.github/actions/apt
        with:
          cache-name: goldens
          packages: libasound2-dev pkg-config libudev-dev
      - name: Rust (the version in rust-toolchain.toml)
        # One at a time: the owner's PC runs four jobs side by side sharing one ~/.rustup.
        run: flock "$HOME/.rustup-install.lock" rustup toolchain install
      # The PC keeps build files between runs, one folder per job (a job can land on any of the four runners, and
      # cargo locks a folder while it builds). Outside the checkout, which actions/checkout cleans.
      - name: Build files folder (owner's PC)
        if: runner.environment == 'self-hosted'
        run: echo "CARGO_TARGET_DIR=$HOME/target/${{ github.job }}" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          prefix-key: v1-ubuntu-24.04
      # golden_liquid and the pinned pictures draw, so they run on the owner's card (gpu-pictures) instead.
      - name: Physics goldens
        if: needs.changes.outputs.goldens_kit == 'true'
        run: >-
          cargo test --release -p bpe-kit --test golden --test golden_health --test golden_particles
          --test golden_particles_meeting --test golden_particles_motion --test golden_rules --test golden_text
      - name: Sound goldens
        if: needs.changes.outputs.goldens_sound == 'true' && !cancelled()
        # Only the goldens: the release-only speed checks in these files measure the machine, not the code.
        run: cargo test --release -p bpe-sound --test chain --test shape_voice --test mod_matrix golden

  windows:
    name: Windows cross-build
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.runner) }}
    timeout-minutes: 90
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v5
      - name: MinGW
        if: runner.environment == 'github-hosted'
        uses: ./.github/actions/apt
        with:
          cache-name: mingw
          packages: gcc-mingw-w64-x86-64
      - name: Rust (the version in rust-toolchain.toml)
        # One at a time: the owner's PC runs four jobs side by side sharing one ~/.rustup.
        run: flock "$HOME/.rustup-install.lock" rustup toolchain install
      # The PC keeps build files between runs, one folder per job (a job can land on any of the four runners, and
      # cargo locks a folder while it builds). Outside the checkout, which actions/checkout cleans.
      - name: Build files folder (owner's PC)
        if: runner.environment == 'self-hosted'
        run: echo "CARGO_TARGET_DIR=$HOME/target/${{ github.job }}" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          prefix-key: v1-ubuntu-24.04
      - name: Build the editor and the renderer for Windows
        run: cargo build --release --target x86_64-pc-windows-gnu -p bpe-studio -p bpe-cli
